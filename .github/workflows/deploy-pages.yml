name: Deploy public website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate site content
        run: |
          node scripts/validate-site.mjs
          node scripts/test-entry-images.mjs
          node scripts/test-buyer-entry.mjs
          node scripts/test-buyer-guide-copy.mjs
          node scripts/test-mic-review.mjs
          node scripts/test-indexnow.mjs
          node scripts/test-wired-selection.mjs
          node scripts/test-model-faq.mjs
          node scripts/test-certificate-references.mjs
          node scripts/test-contact-flow.mjs
          node scripts/test-contact-actions.mjs
          node scripts/test-contact-submission.mjs
          python3 scripts/test-public-links.py
          python3 scripts/audit-public-links.py

      - name: Build public bundle
        run: |
          node scripts/build-pages.mjs
          python3 scripts/audit-public-links.py --root public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow after deployment
        id: indexnow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/notify-indexnow.mjs --before "$BEFORE_SHA" --after "$AFTER_SHA" --submit

      - name: Report notification failure
        if: steps.indexnow.outcome == 'failure'
        run: echo "::warning::Website deployed, but IndexNow notification failed. Review the notification log; no indexing or citation result is confirmed."
